<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 200" width="720" height="200" role="img" aria-label="Calculator flow from 230 running watts to a 1,000 watt recommendation">
  <rect width="720" height="200" fill="#f6f8fa"/>
  <g font-family="system-ui,Segoe UI,sans-serif" fill="#1f2328">
    <rect x="16" y="48" width="120" height="88" rx="8" fill="#fff" stroke="#d0d7de"/>
    <text x="76" y="78" text-anchor="middle" font-size="13" font-weight="700">230 W</text>
    <text x="76" y="100" text-anchor="middle" font-size="11" fill="#57606a">running total</text>
    <text x="148" y="98" font-size="18" fill="#b04522">+</text>
    <rect x="168" y="48" width="120" height="88" rx="8" fill="#fff" stroke="#d0d7de"/>
    <text x="228" y="78" text-anchor="middle" font-size="13" font-weight="700">450 W</text>
    <text x="228" y="100" text-anchor="middle" font-size="11" fill="#57606a">extra surge</text>
    <text x="300" y="98" font-size="18" fill="#b04522">=</text>
    <rect x="320" y="48" width="110" height="88" rx="8" fill="#fff" stroke="#d0d7de"/>
    <text x="375" y="78" text-anchor="middle" font-size="13" font-weight="700">680 W</text>
    <text x="375" y="100" text-anchor="middle" font-size="11" fill="#57606a">peak</text>
    <text x="442" y="98" font-size="16" fill="#b04522">×1.20</text>
    <rect x="500" y="36" width="200" height="112" rx="8" fill="#fff" stroke="#b04522" stroke-width="2"/>
    <text x="600" y="78" text-anchor="middle" font-size="13">816 W rounds up</text>
    <text x="600" y="106" text-anchor="middle" font-size="18" font-weight="700">1,000 W</text>
  </g>
</svg>
