model:
  provider: xai-oauth
  default: grok-4.5
  max_tokens: 16384
  base_url: https://api.x.ai/v1
  api_mode: codex_responses
providers:
  tokenrouter:
    api: https://api.tokenrouter.com/v1
    key_env: TOKENROUTER_API_KEY
    default_model: z-ai/glm-5.3
    name: TokenRouter
    transport: chat_completions
    discover_models: true
  vyce:
    api: https://vyceai.com/v1
    key_env: VYCE_API_KEY
    default_model: gpt-5.6-new
    name: Vyce AI
    transport: chat_completions
    discover_models: true
    extra_headers:
      User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML,
        like Gecko) Chrome/128.0.0.0 Safari/537.36
  token-harbor:
    api: https://tokenharbor.ai/v1
    key_env: TOKENHARBOR_API_KEY
    default_model: grok-4.6
    name: Token Harbor
    transport: chat_completions
    discover_models: true
  orcarouter:
    api: https://api.orcarouter.ai/v1
    key_env: ORCAROUTER_API_KEY
    default_model: z-ai/glm-5.3
    name: OrcaRouter
    transport: chat_completions
    discover_models: true
  explabs:
    api: https://api.experientiallabs.ai/v1
    key_env: EXPLABS_API_KEY
    default_model: glm-5.3
    name: Experiential Labs
    transport: chat_completions
    discover_models: true
  omniroute:
    api: http://127.0.0.1:20128/v1
    key_env: OMNIROUTE_API_KEY
    api_key: sk-omni-4410eba896d76b846ad0bacfcec22e9c02287d56359a115c
    default_model: auto
    name: OmniRoute
    transport: chat_completions
    discover_models: true
  kiraai:
    api: https://api.kiraai.ai/v1
    key_env: KIRAAI_API_KEY
    name: KiraAI
    transport: chat_completions
    discover_models: true
  deepseek:
    api: https://api.deepseek.com/v1
    key_env: DEEPSEEK_API_KEY
    name: DeepSeek
    transport: chat_completions
    default_model: deepseek-v4-flash
    discover_models: true
  kira:
    api: https://kiraai.vn/api/v1
    key_env: KIRA_API_KEY
    default_model: kira-3.5-pro
    name: Kira AI
    transport: chat_completions
    discover_models: true
  minimax:
    api: https://api.minimax.io/v1
    key_env: MINIMAX_API_KEY
    default_model: MiniMax-M3
    name: MiniMax
    transport: chat_completions
    discover_models: true
  xkiro:
    api: https://api.xkiro.ai/v1
    key_env: XKIRO_API_KEY
    default_model: kira-3.5-pro
    name: Xkiro
    transport: chat_completions
    discover_models: true
fallback_providers:
  - provider: nvidia
    model: nvidia/nemotron-3-super-120b-a12b
  - provider: nvidia
    model: nvidia/nemotron-3.5-lightning-30b-a3b
  - provider: orcarouter
    model: z-ai/glm-5.3
  - provider: explabs
    model: glm-5.3
web:
  backend: nous
browser:
  use_real_profile: true
  cloud_provider: nous
checkpoints:
  enabled: true
auxiliary:
  vision:
    provider: auto
    model: ''
tts:
  provider: nous
memory:
  memory_char_limit: 8800
  user_char_limit: 8000
moa:
  presets:
    default:
      reference_models:
        - provider: openai-codex
          model: gpt-5.5
          enabled: true
      enabled: false
      degraded_reference_policy: loud
      fanout: user_turn
  reference_models:
    - provider: openai-codex
      model: gpt-5.5
      enabled: true
  aggregator:
    provider: openrouter
    model: anthropic/claude-opus-4.8
  degraded_reference_policy: loud
  fanout: user_turn
  enabled: false
command_allowlist: []
plugins:
  enabled:
    - herdr-agent-state
    - muse
    - video_gen/muse
_config_version: 45
mcp_servers:
  obsidian:
    command: uvx
    args:
      - mcp-obsidian
    env:
      OBSIDIAN_PORT: '27124'
      OBSIDIAN_API_KEY: 2fa3093153a1eb7b136c37f51461b6bbf74a08b2253e70869e9c39c20be940a1
      OBSIDIAN_HOST: 127.0.0.1
    connect_timeout: 120
    enabled: true
  pyscrappy:
    command: wsl
    args:
      - -e
      - /home/jpanasuk/pyscrappy-venv/bin/pyscrappy-mcp
    timeout: 120
    connect_timeout: 60
  cloudflare:
    url: https://mcp.cloudflare.com/mcp
    enabled: false
  cloudflare-docs:
    url: https://docs.mcp.cloudflare.com/mcp
  cloudflare-builds:
    url: https://builds.mcp.cloudflare.com/mcp
    enabled: false
  cloudflare-observability:
    url: https://observability.mcp.cloudflare.com/mcp
    enabled: false
image_gen:
  provider: nous
video_gen:
  provider: muse
  model: grok-imagine-video
bot_peers:
  lightbringer:
    url: ''
    note: RETIRED 2026-09-14 — public bus API killed after Hermes credit burn. Do
      not reconnect Muse/Spark.

# ── Security ──────────────────────────────────────────────────────────
# Secret redaction is ON by default — strings that look like API keys,
# tokens, and passwords are masked in tool output, logs, and chat
# responses before the model or user ever sees them. Set redact_secrets
# to false to disable (e.g. when developing the redactor itself).
# tirith pre-exec scanning is enabled by default when the tirith binary
# is available. Configure via security.tirith_* keys or env vars
# (TIRITH_ENABLED, TIRITH_BIN, TIRITH_TIMEOUT, TIRITH_FAIL_OPEN).
#
# security:
#   redact_secrets: true
#   tirith_enabled: true
#   tirith_path: "tirith"
#   tirith_timeout: 5
#   tirith_fail_open: true

# ── Fallback Model ────────────────────────────────────────────────────
# Automatic provider failover when primary is unavailable.
# Uncomment and configure to enable. Triggers on rate limits (429),
# overload (529), service errors (503), or connection failures.
#
# Supported providers:
#   openrouter   (OPENROUTER_API_KEY)  — routes to any model
#   openai-codex (OAuth — hermes auth) — OpenAI Codex
#   nous         (OAuth — hermes auth) — Nous Portal
#   zai          (ZAI_API_KEY)         — Z.AI / GLM
#   kimi-coding  (KIMI_API_KEY)        — Kimi / Moonshot
#   kimi-coding-cn (KIMI_CN_API_KEY)   — Kimi / Moonshot (China)
#   minimax      (MINIMAX_API_KEY)     — MiniMax
#   minimax-cn   (MINIMAX_CN_API_KEY)  — MiniMax (China)
#   bedrock      (AWS IAM / boto3)     — AWS Bedrock (Converse API)
#
# For custom OpenAI-compatible endpoints, add base_url and key_env.
#
# fallback_model:
#   provider: openrouter
#   model: anthropic/claude-sonnet-4
