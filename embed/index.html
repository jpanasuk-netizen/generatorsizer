<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Generator size calculator</title>
<meta name="robots" content="noindex, follow">
<link rel="canonical" href="https://generator-sizer.com/">
<style>
:root{color-scheme:light dark;--bg:#f6f7f8;--fg:#1c1f23;--mut:#5c6570;--bd:#cfd4da;--card:#fff;--acc:#b04522}
@media (prefers-color-scheme:dark){:root{--bg:#14171b;--fg:#e8eaed;--mut:#a7b0ba;--bd:#3a414b;--card:#1c2128;--acc:#e07a4c}}
*{box-sizing:border-box}
body{margin:0;padding:.75rem .85rem 1rem;background:var(--bg);color:var(--fg);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
h1{font-size:1.05rem;margin:0 0 .35rem}
.credit{margin:0 0 .55rem;font-size:.85rem}
a{color:var(--acc)}
.field{margin:.45rem 0}
label{display:block;font-size:.8rem;color:var(--mut);margin-bottom:.15rem}
input,select,button{font:inherit}
select,input[type="number"],input[type="text"]{width:100%;max-width:100%;background:var(--card);color:var(--fg);border:1px solid var(--bd);border-radius:8px;padding:.4rem .5rem}
.row2{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.45rem}
.load-row{display:grid;grid-template-columns:1.4fr .7fr .7fr .45fr auto;gap:.3rem;align-items:center;margin:.25rem 0}
.load-head{font-size:.75rem;color:var(--mut)}
button{background:var(--acc);color:#fff;border:0;border-radius:8px;padding:.45rem .7rem;cursor:pointer}
button.del{background:transparent;color:var(--mut);padding:.2rem .4rem}
.small{font-size:.8rem;color:var(--mut);margin:.3rem 0}
.ans{margin-top:.6rem;padding:.6rem;border:1px solid var(--bd);border-radius:8px;background:var(--card)}
.big{font-size:1.25rem;font-weight:700}
.unit{font-weight:500;font-size:.9rem}
.note{font-size:.8rem;color:var(--mut)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:.35rem;margin:.4rem 0}
.stat{font-size:.8rem}
.stat b{display:block;font-size:.95rem}
@media (max-width:520px){.row2{grid-template-columns:1fr}.load-row{grid-template-columns:1fr 1fr}.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>
<p class="credit">Calculator by <a href="https://generator-sizer.com/" target="_blank" rel="noopener">GeneratorSizer</a></p>
<h1>Generator size</h1>
<div class="field">
  <label for="presetSelect">Add an appliance</label>
  <div style="display:flex;gap:.4rem">
    <select id="presetSelect" style="flex:1"></select>
    <button type="button" data-add>Add</button>
  </div>
</div>
<div id="loadRows"></div>
<div class="row2">
  <div class="field">
    <label for="headroom">Headroom (%)</label>
    <input type="number" id="headroom" value="20" min="0" max="100">
  </div>
  <div class="field">
    <label for="hrsDay">Hours per day</label>
    <input type="number" id="hrsDay" value="8" min="1" max="24">
  </div>
  <div class="field">
    <label for="tankGal">Tank (gallons)</label>
    <input type="number" id="tankGal" value="4" min="0.5" step="0.5">
  </div>
</div>
<button type="button" onclick="sizeGenerator()">Size my generator</button>
<div id="genResult" class="ans" hidden></div>
<script src="/assets/app.js"></script>
</body>
</html>
